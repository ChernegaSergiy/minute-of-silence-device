[package]
name = "minute-of-silence-device"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Serhii Cherneha"]
license-file = "LICENSE"
description = "Firmware for the Minute of Silence standalone IoT device"
repository = "https://github.com/ChernegaSergiy/minute-of-silence-device"

[dependencies]
esp-hal = { version = "0.22", features = ["esp32"] }
esp-alloc = "0.5"
esp-backtrace = { version = "0.14", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "0.12", features = ["esp32", "log"] }
log = "0.4"
khvylyna-core = { git = "https://github.com/ChernegaSergiy/minute-of-silence", default-features = false, features = ["alloc"] }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
