[package]
name = "minute-of-silence-device"
version = "0.1.0"
description = "A standalone hardware device and firmware for Ukraine's daily national moment of silence"
authors = ["Serhii Cherneha"]
license-file = "LICENSE"
repository = "https://github.com/ChernegaSergiy/minute-of-silence-device"
edition = "2024"
rust-version = "1.85"

[dependencies]
esp-hal = { version = "1.2.3", features = ["esp32", "unstable"] }
esp-alloc = { version = "0.11.0", features = ["esp32"] }
esp-backtrace = { version = "0.20.0", features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "0.18.0", features = ["esp32", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32", "wifi"] }
esp-rtos = { version = "0.4.0", features = ["esp32", "esp-radio", "embassy"] }
embassy-executor = "0.10.0"
embassy-net = { version = "0.9.1", features = ["dhcpv4", "medium-ethernet", "udp", "dns", "multicast"] }
embassy-time = "0.5.0"
sntpc = { version = "0.11", default-features = false }
sntpc-net-embassy = { version = "0.11", default-features = false }
log = "0.4"
embedded-sdmmc = { version = "0.8.1", default-features = false }
embedded-hal-bus = "0.3.0"
esp-storage = { version = "0.10.0", features = ["esp32"] }
khvylyna-core = { git = "https://github.com/ChernegaSergiy/minute-of-silence", default-features = false, features = ["alloc"] }

[profile.dev]
opt-level = "s"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
